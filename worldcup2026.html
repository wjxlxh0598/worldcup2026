<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #0a0e17;
    --card-bg: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0f172a 0%, #1a2450 50%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 50%, rgba(59,130,246,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(245,158,11,0.06) 0%, transparent 60%);
    animation: headerGlow 8s ease-in-out infinite alternate;
  }
  @keyframes headerGlow {
    0% { transform: translate(0, 0); }
    100% { transform: translate(2%, -1%); }
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    position: relative;
  }
  .header h1 .icon { font-size: 2.2rem; }
  .header .subtitle {
    color: var(--text-muted);
    margin-top: 6px;
    font-size: 0.9rem;
    position: relative;
  }

  /* Container */
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

  /* Stats cards */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: #334155; }
  .stat-card .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat-card .stat-value { font-size: 2rem; font-weight: 700; margin-top: 4px; }
  .stat-card .stat-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

  /* Controls */
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 200px; max-width: 320px;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: #475569; }

  .filter-group {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-muted); padding: 8px 14px; font-size: 0.82rem; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { color: var(--text); border-color: #475569; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .sort-select {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 9px 12px; font-size: 0.85rem; outline: none; cursor: pointer;
  }
  .sort-select:focus { border-color: var(--accent); }

  /* Table */
  .table-wrap {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  thead th {
    background: #1a1f2e; color: var(--text-muted); font-weight: 600; font-size: 0.75rem;
    text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px; text-align: left;
    cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 2px solid var(--border);
    transition: color 0.15s;
  }
  thead th:hover { color: var(--text); }
  thead th .sort-arrow { font-size: 0.65rem; margin-left: 4px; }
  tbody td {
    padding: 12px 16px; border-bottom: 1px solid #1a1f2e; white-space: nowrap;
  }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover { background: rgba(59,130,246,0.04); }
  tbody tr:last-child td { border-bottom: none; }

  .team-cell { display: flex; align-items: center; gap: 10px; }
  .team-flag { font-size: 1.4rem; width: 28px; text-align: center; flex-shrink: 0; }
  .team-name { font-weight: 600; }
  .team-confed { font-size: 0.7rem; color: var(--text-muted); }

  .rank-num { font-weight: 700; color: var(--text-muted); }
  .rank-1 .rank-num, .rank-2 .rank-num, .rank-3 .rank-num { color: var(--gold); }

  .winrate-bar-wrap { display: flex; align-items: center; gap: 10px; min-width: 140px; }
  .winrate-bar-bg { flex: 1; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
  .winrate-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .winrate-val { font-weight: 700; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }

  .tier-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.3px;
  }
  .tier-S { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .tier-A { background: rgba(239,68,68,0.15); color: #f87171; }
  .tier-B { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .tier-C { background: rgba(16,185,129,0.15); color: #34d399; }
  .tier-D { background: rgba(148,163,184,0.15); color: #94a3b8; }

  /* Chart section */
  .section-title {
    font-size: 1.15rem; font-weight: 700; margin: 28px 0 16px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .chart-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; margin-bottom: 20px;
  }
  .chart-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  }
  .chart-card h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }
  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { width: 100px; font-size: 0.8rem; text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 22px; background: #1e293b; border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 0.72rem; font-weight: 600; transition: width 0.5s ease; }
  .bar-val { min-width: 42px; font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Footer */
  .footer {
    text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.75rem; border-top: 1px solid var(--border); margin-top: 32px;
  }

  @media (max-width: 768px) {
    .header h1 { font-size: 1.4rem; }
    .chart-grid { grid-template-columns: 1fr; }
    .controls { flex-direction: column; align-items: stretch; }
    .search-box { max-width: none; }
  }
</style>
</head>

  { id: 'AFC',    name: 'AFC 亚洲',         color: '#ef4444' },
  { id: 'CONCACAF', name: 'CONCACAF 中北美', color: '#8b5cf6' },
  { id: 'OFC',    name: 'OFC 大洋洲',        color: '#ec4899' },
];

const confedColorMap = {};
confederations.forEach(c => { confedColorMap[c.id] = c.color; });

// ==================== STATE ====================
let activeConfed = 'all';
let sortBy = 'rank';
let searchQuery = '';

// ==================== RENDER CONTROLS ====================
function renderConfedFilters() {
  const container = document.getElementById('confedFilters');
  container.innerHTML = confederations.map(c => {
    const active = activeConfed === c.id ? ' active' : '';
    return `<button class="filter-btn${active}" data-confed="${c.id}">${c.name}</button>`;
  }).join('');

  container.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeConfed = btn.dataset.confed;
      renderConfedFilters();
      renderAll();
    });
  });
}

// ==================== FILTER & SORT ====================
function getFilteredTeams() {
  let filtered = [...teams];

  if (activeConfed !== 'all') {
    filtered = filtered.filter(t => t.confed === activeConfed);
  }

  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    filtered = filtered.filter(t => t.name.toLowerCase().includes(q) || t.confed.toLowerCase().includes(q));
  }

  switch (sortBy) {
    case 'winrate-desc': filtered.sort((a, b) => b.winRate - a.winRate); break;
    case 'winrate-asc':  filtered.sort((a, b) => a.winRate - b.winRate); break;
    case 'name':         filtered.sort((a, b) => a.name.localeCompare(b.name, 'zh')); break;
    case 'fifa-desc':    filtered.sort((a, b) => a.fifa - b.fifa); break;
    default:             filtered.sort((a, b) => a.rank - b.rank); break;
  }
  return filtered;
}

// ==================== RENDER TABLE ====================
function renderTable() {
  const filtered = getFilteredTeams();
  const tbody = document.getElementById('tableBody');

  tbody.innerHTML = filtered.map((t, i) => {
    const wrColor = t.winRate >= 75 ? 'var(--green)' : t.winRate >= 65 ? 'var(--accent)' : t.winRate >= 50 ? 'var(--gold)' : 'var(--red)';
    const rankClass = t.rank <= 3 ? ` rank-${t.rank}` : '';
    return `
      <tr class="${rankClass.trim()}">
        <td><span class="rank-num">#${t.rank}</span></td>
        <td>
          <div class="team-cell">
            <span class="team-flag">${t.flag}</span>
            <span class="team-name">${t.name}</span>
          </div>
        </td>
        <td><span class="team-confed">${t.confed}</span></td>
        <td>${t.fifa}</td>
        <td><span class="tier-badge tier-${t.tier}">${t.tier}</span></td>
        <td>
          <div class="winrate-bar-wrap">
            <div class="winrate-bar-bg"><div class="winrate-bar-fill" style="width:${t.winRate}%;background:${wrColor}"></div></div>
            <span class="winrate-val" style="color:${wrColor}">${t.winRate.toFixed(1)}%</span>
          </div>
        </td>
        <td>${t.histWinRate.toFixed(1)}%</td>
        <td>${t.recentWinRate.toFixed(1)}%</td>
        <td>${t.strongWinRate.toFixed(1)}%</td>
        <td><strong>${t.titleProb.toFixed(1)}%</strong></td>
      </tr>`;
  }).join('');

  document.getElementById('statsRow').innerHTML = buildStatsHTML(filtered);
}

function buildStatsHTML(filtered) {
  const avgWR = filtered.length ? (filtered.reduce((s, t) => s + t.winRate, 0) / filtered.length).toFixed(1) : 0;
  const maxWR = filtered.length ? Math.max(...filtered.map(t => t.winRate)).toFixed(1) : 0;
  const topTeam = filtered.length ? filtered.reduce((a, b) => a.winRate > b.winRate ? a : b) : null;
  const sCount = filtered.filter(t => t.tier === 'S').length;
  const aCount = filtered.filter(t => t.tier === 'A').length;
  const totalProb = filtered.reduce((s, t) => s + t.titleProb, 0).toFixed(1);

  return `
    <div class="stat-card">
      <div class="stat-label">当前筛选球队</div>
      <div class="stat-value" style="color:var(--accent)">${filtered.length}</div>
      <div class="stat-sub">共48支参赛队</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均综合胜率</div>
      <div class="stat-value" style="color:var(--green)">${avgWR}%</div>
      <div class="stat-sub">筛选范围内</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">最高胜率球队</div>
      <div class="stat-value" style="color:var(--gold)">${topTeam ? topTeam.flag + ' ' + topTeam.name : '-'}</div>
      <div class="stat-sub">综合胜率 ${maxWR}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">冠军梯队 (S/A)</div>
      <div class="stat-value" style="color:var(--red)">${sCount + aCount} 队</div>
      <div class="stat-sub">S级${sCount}队 · A级${aCount}队</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">夺冠概率总和</div>
      <div class="stat-value" style="color:var(--purple-color, #a78bfa)">${totalProb}%</div>
      <div class="stat-sub">48队概率合计</div>
    </div>
  `;
}

// ==================== RENDER CHARTS ====================
function renderCharts() {
  const filtered = getFilteredTeams();

  // Top 15 by winRate
  const top15 = [...teams].sort((a, b) => b.winRate - a.winRate).slice(0, 15);
  document.getElementById('topWinrateChart').innerHTML = top15.map((t, i) => `
    <div class="bar-row">
      <span class="bar-label">${i + 1}. ${t.flag} ${t.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${t.winRate}%;background:${confedColorMap[t.confed]}">${t.tier}</div></div>
      <span class="bar-val">${t.winRate.toFixed(1)}%</span>
    </div>
  `).join('');

  // Confederation average
  const confedStats = {};
  teams.forEach(t => {
    if (!confedStats[t.confed]) confedStats[t.confed] = { sum: 0, count: 0 };
    confedStats[t.confed].sum += t.winRate;
    confedStats[t.confed].count++;
  });
  const confedAvg = Object.entries(confedStats)
    .map(([k, v]) => ({ confed: k, avg: v.sum / v.count, color: confedColorMap[k] }))
    .sort((a, b) => b.avg - a.avg);

  document.getElementById('confedAvgChart').innerHTML = confedAvg.map(c => `
    <div class="bar-row">
      <span class="bar-label">${c.confed}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${c.avg}%;background:${c.color}"></div></div>
      <span class="bar-val">${c.avg.toFixed(1)}%</span>
    </div>
  `).join('');

  // Tier distribution
  const tierCount = { S: 0, A: 0, B: 0, C: 0, D: 0 };
  const tierWinRate = { S: 0, A: 0, B: 0, C: 0, D: 0 };
  teams.forEach(t => { tierCount[t.tier]++; tierWinRate[t.tier] += t.winRate; });
  const tierLabels = { S: 'S 级 (夺冠热门)', A: 'A 级 (强队)', B: 'B 级 (劲旅)', C: 'C 级 (中游)', D: 'D 级 (陪跑)' };
  const tierColors = { S: '#fbbf24', A: '#f87171', B: '#60a5fa', C: '#34d399', D: '#94a3b8' };
  const tierEntries = Object.entries(tierCount).map(([k, v]) => ({
    tier: k, count: v, avg: v ? (tierWinRate[k] / v) : 0, color: tierColors[k], label: tierLabels[k]
  }));

  document.getElementById('tierDistChart').innerHTML = tierEntries.map(t => `
    <div class="bar-row">
      <span class="bar-label">${t.label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(t.avg, 8)}%;background:${t.color}">${t.count}队</div></div>
      <span class="bar-val">均${t.avg.toFixed(1)}%</span>
    </div>
  `).join('');

  // Historical win rate top 15
  const hist15 = [...teams].sort((a, b) => b.histWinRate - a.histWinRate).slice(0, 15);
  document.getElementById('historicalChart').innerHTML = hist15.map((t, i) => `
    <div class="bar-row">
      <span class="bar-label">${i + 1}. ${t.flag} ${t.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${t.histWinRate}%;background:${confedColorMap[t.confed]}"></div></div>
      <span class="bar-val">${t.histWinRate.toFixed(1)}%</span>
    </div>
  `).join('');
}

function renderAll() {
  renderTable();
  renderCharts();
}

// ==================== EVENT LISTENERS ====================
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderAll();
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
  sortBy = e.target.value;
  renderAll();
});

// ==================== BOOT ====================
renderConfedFilters();
renderAll();
</script>

</body>
</html>
